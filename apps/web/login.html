<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f7fb"><title>登录 · Accufolio</title><link rel="icon" href="/icon-192.png"><style>
:root{color-scheme:light dark;--bg:#f5f7fb;--surface:#ffffffd9;--ink:#1c2230;--muted:#677183;--line:#dce1ea;--accent:#2864e5}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 90% 5%,#dce7ff88,transparent 65%),var(--bg);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}main{width:min(100%,420px);padding:32px;border:1px solid var(--line);border-radius:28px;background:var(--surface);box-shadow:0 20px 70px #2137610c;backdrop-filter:blur(20px)}.brand{display:flex;align-items:center;gap:12px;font-size:22px;font-weight:650}.brand img{border-radius:14px}h1{font-size:26px;margin:28px 0 6px}p{color:var(--muted);margin:0 0 22px;font-size:14px}label{display:block;font-size:14px;margin:16px 0 6px}input:not([type=checkbox]){font:inherit;width:100%;border:1px solid var(--line);border-radius:13px;background:var(--bg);color:var(--ink);padding:12px 14px}input:focus-visible,button:focus-visible{outline:3px solid #739fff;outline-offset:2px}.remember{display:flex;gap:9px;align-items:center}.remember input{width:18px;height:18px;accent-color:var(--accent)}button{width:100%;border:0;border-radius:14px;padding:13px;margin-top:14px;background:var(--accent);color:white;font:600 16px/1.5 inherit;cursor:pointer}button:disabled{opacity:.6}#login-error{color:#bf344a;margin:12px 0 0;min-height:24px}small{display:block;color:var(--muted);margin-top:16px;font-size:12px}@media(prefers-color-scheme:dark){:root{--bg:#11141a;--surface:#1d222be6;--ink:#f3f5f9;--muted:#a8b3c4;--line:#394150;--accent:#5086f5}body{background:var(--bg)}}@media(max-width:360px){body{padding:16px}main{padding:24px}}
</style></head><body><main><div class="brand"><img src="/icon-192.png" width="44" height="44" alt="">Accufolio</div><h1>欢迎回来</h1><p>登录你的站点，查看每一份资产。</p><form id="login-form"><label for="username">用户名</label><input id="username" name="username" value="admin" autocomplete="username" required maxlength="200"><label for="password">密码</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="4096"><label class="remember"><input id="remember" name="remember" type="checkbox" checked>在此设备保持登录</label><button id="sign-in" type="submit">登录</button><p id="login-error" role="status" aria-live="polite"></p><small>保持登录最长 90 天。可在设置中退出；更换站点密码后需重新登录。密码不会保存在应用中。</small></form></main><script>
document.querySelector('#login-form').addEventListener('submit',async event=>{event.preventDefault();const button=document.querySelector('#sign-in'),error=document.querySelector('#login-error');button.disabled=true;error.textContent='';try{const response=await fetch('/api/session',{method:'POST',headers:{'Content-Type':'application/json','X-Accufolio':'1'},body:JSON.stringify({username:document.querySelector('#username').value,password:document.querySelector('#password').value,remember:document.querySelector('#remember').checked})});if(!response.ok)throw new Error(response.status===401?'用户名或密码不正确，请重新输入。':'暂时无法登录，请稍后重试。');document.querySelector('#password').value='';const next=new URLSearchParams(location.search).get('next');location.replace(['/assets','/investments','/records','/discover','/settings'].includes(next)?next:'/assets');}catch(failure){error.textContent=failure.message;}finally{button.disabled=false;}});
</script></body></html>
