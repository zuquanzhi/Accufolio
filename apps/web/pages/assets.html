<section id="view-assets" class="app-view total-assets" aria-labelledby="assets-title">
  <button type="button" id="account-back" class="detail-back" hidden>‹ 返回资产</button>
  <div class="page-heading"><div><p class="eyebrow">YOUR FINANCIAL PICTURE</p><h1 id="assets-title" tabindex="-1">资产</h1></div></div>
  <div id="assets-overview">
    <section class="wealth-card net-assets-card" aria-label="净资产">
      <div class="wealth-top"><span id="assets-total-label">净资产 · USD</span><span id="asset-account-count" class="subtle">—</span></div>
      <strong id="assets-total" class="wealth-value">—</strong><p id="assets-total-note" class="valuation-note">正在汇总账户…</p>
      <div class="wealth-metrics"><div><span>证券持仓市值</span><strong id="assets-securities">—</strong><a class="text-button" href="/investments">查看投资 ›</a></div><div><span>现金账户余额</span><strong id="assets-cash">—</strong><small>按各账户最近余额汇总</small></div></div>
    </section>
    <div class="total-assets-grid">
      <section class="panel asset-accounts-panel"><div class="section-head"><div><h2>我的账户</h2><p>资金在哪里，用于什么。</p></div><span class="subtle">点按查看流水</span></div><div id="asset-accounts"><p class="empty">正在读取账户…</p></div></section>
      <section class="panel total-allocation-panel"><div class="section-head"><h2>资产分配</h2><span id="assets-allocation-currency" class="subtle">USD</span></div><div id="total-allocation-ring" class="allocation-ring"></div><div id="total-allocation-legend" class="allocation-legend"></div><p id="assets-allocation-note" class="field-hint"></p></section>
    </div>
    <details class="dashboard-method"><summary>估值与数据来源</summary><p id="assets-fx-note" class="field-hint"></p><p class="field-hint">净资产为证券持仓市值与现金账户余额之和。账户余额由 Agent 记录的流水累计；行情、余额与汇率可能对应不同时间。</p><div id="assets-warnings"></div></details>
  </div>
  <div id="asset-account-detail" hidden>
    <section class="wealth-card account-summary-card"><div class="wealth-top"><span id="account-kind">账户</span><span id="account-purpose" class="subtle"></span></div><strong id="account-value" class="wealth-value">—</strong><p id="account-value-note" class="valuation-note"></p><div class="wealth-metrics" id="account-metrics" data-cash-only="true"><div><span id="account-cash-label">原币余额</span><strong id="account-native-balance">—</strong><small id="account-balance-date"></small></div><div id="account-securities-metric" hidden><span>证券持仓</span><strong id="account-securities-value">—</strong><small id="account-quote-time"></small></div></div></section>
    <section class="panel cash-flow-panel"><div class="section-head"><div><h2>资金流水</h2><p>原币金额与每笔余额，可核对转账及冲销。</p></div></div><div id="account-cash-entries" aria-live="polite"></div><p class="field-hint panel-footnote">余额按记账日期、同日流水顺序累计。冲销保留原记录与反向流水；账户间转账不代表新增收入。</p></section>
  </div>
</section>
