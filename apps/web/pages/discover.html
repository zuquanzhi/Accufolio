<section id="view-discover" class="app-view discover-view" aria-labelledby="discover-title">
  <div class="page-heading discover-heading">
    <div>
      <button type="button" id="discover-back" class="discover-back" hidden><svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="m14 6-6 6 6 6"/></svg><span>发现</span></button>
      <h1 id="discover-title" tabindex="-1">发现</h1>
    </div>
  </div>

  <div id="discover-home" class="discover-directory">
    <nav class="discover-group" aria-label="收入与策略测算">
      <a class="discover-row" href="/discover?tool=backtest" data-discover-tool="backtest">
        <span class="discover-icon discover-icon-strategy"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M4 19V5m0 14h16M7 14l4-5 4 3 5-7"/><path d="M16 5h4v4"/></svg></span>
        <span class="discover-row-label">策略回测</span><span class="discover-row-meta">4 种策略</span><svg class="icon discover-chevron" aria-hidden="true"><use href="#icon-arrow"/></svg>
      </a>
      <a class="discover-row" href="/discover?tool=income" data-discover-tool="income">
        <span class="discover-icon discover-icon-income"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 7h8M8 12h1m6 0h1m-8 4h1m6 0h1"/></svg></span>
        <span class="discover-row-label">税后收入</span><span class="discover-row-meta">工资估算</span><svg class="icon discover-chevron" aria-hidden="true"><use href="#icon-arrow"/></svg>
      </a>
    </nav>
  </div>

  <section class="panel discover-detail" id="backtest-panel" data-discover-panel="backtest" hidden aria-label="策略回测"><div class="section-head"><div><h2>找到适合自己的节奏</h2><p>用历史数据，比较四种定投方式。</p></div></div><form id="backtest"><label>标的<input name="symbol" value="QQQM" required maxlength="15" pattern="[A-Za-z0-9.\-]+" autocapitalize="characters"></label><label>每月投入 · USD<input name="monthly" type="number" min="0.01" step="any" value="300" required inputmode="decimal"></label><label>开始日期<input name="start" type="date" required></label><label>结束日期<input name="end" type="date" required></label><button type="submit" id="run-history" class="primary full-width">获取行情并回测</button><details id="manual-data" class="full-width"><summary>手动数据</summary><label class="csv">历史收盘价<textarea name="bars" rows="5" placeholder="2024-01-02,100&#10;2024-02-01,102"></textarea><span class="field-hint">备用方式：每行填写日期和收盘价，以英文逗号分隔。</span></label><button type="button" id="run-manual">使用手动数据回测</button></details></form><p id="history-status" class="field-hint" role="status" aria-live="polite"></p><p id="history-method" class="field-hint"></p><p id="backtest-error" class="form-error" role="alert"></p><div id="backtest-result" aria-live="polite"></div><p class="panel-footnote">历史表现不代表未来收益。未投入资金计为现金。</p></section>

  <section class="discover-detail" id="income-panel" data-discover-panel="income" hidden aria-label="税后收入">
    <div id="income-calculator"></div>
  </section>
</section>
