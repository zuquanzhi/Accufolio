<section id="view-discover" class="app-view" aria-labelledby="discover-title"><div class="page-heading"><div><p class="eyebrow">A LITTLE PERSPECTIVE</p><h1 id="discover-title" tabindex="-1">发现</h1></div></div><div class="segmented-control" aria-label="发现内容"><button type="button" data-discover="backtest" aria-pressed="true">策略实验室</button><button type="button" data-discover="monitoring" aria-pressed="false">行情关注</button></div>
    <section class="panel" id="backtest-panel"><div class="section-head"><div><h2>找到适合自己的节奏</h2><p>用历史数据，比较四种定投方式。</p></div></div><form id="backtest"><label>每月投入 · USD<input name="monthly" type="number" min="0.01" step="any" value="300" required inputmode="decimal"></label><label class="csv">历史收盘价<textarea name="bars" rows="5" required placeholder="2024-01-02,100&#10;2024-02-01,102"></textarea><span class="field-hint">每行填写日期和收盘价，以英文逗号分隔。</span></label><button type="submit" class="primary">比较策略</button></form><div id="backtest-result" aria-live="polite"></div><p class="panel-footnote">历史表现不代表未来收益。未投入资金计为现金。</p></section>
    <section class="panel" id="monitoring" hidden><div class="section-head"><div><h2>关注价格变化</h2><p>关注列表保存在投资账户，行情可能有延迟。</p></div></div><form id="watch-form"><label>标的<input name="symbol" required maxlength="15" value="QQQM"></label><label>涨跌幅阈值 · %<input name="threshold" type="number" min="0.01" max="100" step="any" value="2" required inputmode="decimal"></label><button class="primary">添加关注</button><button type="button" id="scan-now">检查行情</button></form><div id="watch-items"></div><h3>最近提醒</h3><div id="alert-items"></div><details><summary>查看每日摘要</summary><p class="field-hint">时间以 UTC 为准</p><div id="daily-items" class="table-wrap"></div></details></section>
  </section>
