<section id="view-records" class="app-view" aria-labelledby="records-title"><div class="page-heading"><div><p class="eyebrow">YOUR ACTIVITY</p><h1 id="records-title" tabindex="-1">记录</h1></div><button type="button" class="icon-button primary" id="new-trade" hidden aria-label="添加记录"><svg class="icon"><use href="#icon-plus"/></svg></button></div><p class="section-description" id="record-description">投资中的每一步，都值得记录。</p><p class="ledger-hint" id="server-hint">这里展示 AI 为你整理的投资记录，只供查看。</p><section class="panel history-panel" id="history"><div id="trades" class="trades"><p class="empty">正在读取记录…</p></div></section></section>

<dialog id="local-entry" class="trade-sheet" aria-labelledby="trade-title"><div class="sheet-handle" aria-hidden="true"></div><div class="sheet-heading"><h2 id="trade-title">记一笔</h2><button type="button" id="close-trade" class="icon-button" aria-label="关闭并保留草稿">×</button></div><p class="sheet-description">仅保存在此设备，不会上传。</p><form id="trade"><label>交易类型<select name="side"><option value="buy">买入</option><option value="sell">卖出</option></select></label><label>标的<input name="symbol" value="QQQM" required maxlength="15" pattern="[A-Za-z0-9.\-]+"></label><label class="full-width">交易日期<input name="trade_date" type="date" required></label><label>股数<input name="shares" type="number" min="0.00000001" step="any" required inputmode="decimal"></label><label>成交单价 · USD<input name="price" type="number" min="0.00000001" step="any" required inputmode="decimal"></label><label class="full-width">备注<input name="note" maxlength="500" placeholder="给这次投入留句话"></label><p id="trade-notice" class="form-error full-width" role="alert"></p><button type="submit" id="save-trade" class="primary full-width">保存记录</button><button type="button" id="cancel-edit" class="full-width" hidden>取消编辑</button></form></dialog>
