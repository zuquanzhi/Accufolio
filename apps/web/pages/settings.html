<section id="view-settings" class="app-view" aria-labelledby="settings-title"><div class="page-heading"><div><p class="eyebrow">MAKE IT YOURS</p><h1 id="settings-title" tabindex="-1">设置</h1></div></div>
    <section class="settings-group"><h2>显示偏好</h2><div class="settings-card">

      <label class="setting-row preference-select" for="display-currency"><span><strong>展示币种</strong><small>金额与曲线使用的参考币种</small></span><select id="display-currency"><option value="USD">美元 USD</option><option value="CNY">人民币 CNY</option><option value="HKD">港币 HKD</option><option value="EUR">欧元 EUR</option></select></label>
      <label class="setting-row preference-select" for="display-timezone"><span><strong>时间显示</strong><small>行情与检查时间的显示时区</small></span><select id="display-timezone"><option value="">跟随共享设置</option><option value="America/New_York">美东时间</option><option value="Asia/Shanghai">北京时间</option><option value="UTC">UTC</option></select></label>
      <div class="setting-explanation"><p id="currency-status" role="status"></p><p id="timezone-status"></p></div>
    </div><p class="settings-note">币种与时间偏好会记在此设备，下次打开继续使用；不改变交易记录或 Agent 的配置。</p></section>
    <section class="settings-group"><h2>应用</h2><div class="settings-card"><button type="button" id="refresh" class="setting-row"><span class="setting-icon"><svg class="icon"><use href="#icon-refresh"/></svg></span><span class="setting-text"><strong>刷新数据</strong><small>获取最新持仓与行情，保留填写内容</small></span><svg class="icon chevron"><use href="#icon-arrow"/></svg></button><a id="native-connection" class="setting-row native-action" href="accufolio://connection" hidden><span class="setting-text"><strong>连接地址</strong><small>查看或更换数据服务的连接</small></span><svg class="icon chevron"><use href="#icon-arrow"/></svg></a><a id="native-update" class="setting-row native-action" href="accufolio://update" hidden><span class="setting-text"><strong>检查应用更新</strong><small>在应用内下载并安装新版本</small></span><svg class="icon chevron"><use href="#icon-arrow"/></svg></a><a id="native-reload" class="setting-row native-action" href="accufolio://reload" hidden><span class="setting-text"><strong>重新载入页面</strong><small>重新连接前会提示确认</small></span><svg class="icon chevron"><use href="#icon-arrow"/></svg></a><a id="native-settings" class="setting-row" href="accufolio://settings" hidden><span class="setting-text"><strong>连接与更新</strong><small>升级客户端后可直接在此管理</small></span><svg class="icon chevron"><use href="#icon-arrow"/></svg></a><div class="setting-row" id="browser-update-note"><span class="setting-text"><strong>保持最新</strong><small>新版本会自动检测，有未保存内容时先提醒你。</small></span></div></div></section>
    <section class="settings-group" id="server-data-settings"><h2>数据</h2><div class="settings-card"><a href="/api/export" class="setting-row"><span class="setting-text"><strong>导出资产数据</strong><small>账户、流水与投资记录的 JSON 副本</small></span><svg class="icon chevron"><use href="#icon-arrow"/></svg></a><button type="button" id="backup" class="setting-row"><span class="setting-text"><strong>创建备份</strong><small>在连接的服务中保存完整数据库副本</small></span><svg class="icon chevron"><use href="#icon-arrow"/></svg></button></div></section>
    <section class="settings-group"><h2>登录</h2><div class="settings-card"><button type="button" id="logout" class="setting-row"><span class="setting-text"><strong>退出登录</strong><small>忘记此设备的登录，下次打开需要验证</small></span><svg class="icon chevron"><use href="#icon-arrow"/></svg></button></div></section>
    <section class="settings-group" id="system"><details><summary>运行状态与变更记录</summary><p id="health">正在检查</p><button type="button" id="load-audit">查看变更记录</button><div id="audit-items"></div></details></section><footer><img src="/icon-192.png" alt="" width="24" height="24"><span>Accufolio</span><small>长期投资，从容积累。</small></footer>
  </section>
