<section id="view-settings" class="app-view" aria-labelledby="settings-title"><div class="page-heading"><div><p class="eyebrow">MAKE IT YOURS</p><h1 id="settings-title" tabindex="-1">设置</h1></div></div>
    <section class="settings-group"><h2>账户</h2><div class="settings-card"><label class="setting-row ledger-select" for="ledger-mode"><span><strong>记录方式</strong><small>选择要查看的投资记录</small></span><select id="ledger-mode"><option value="server">投资账户</option><option value="local">随手记</option></select></label><div class="setting-explanation"><p><strong>投资账户</strong> · 由 AI 管理，与你连接的服务保持一致。</p><p><strong>随手记</strong> · 自己记录买卖，仅保存在此设备。</p></div></div><p class="settings-note">投资账户与随手记分别保存，不会自动同步。清除浏览器数据或卸载应用可能删除随手记。</p></section>
    <section class="settings-group"><h2>应用</h2><div class="settings-card"><button type="button" id="refresh" class="setting-row"><span class="setting-icon"><svg class="icon"><use href="#icon-refresh"/></svg></span><span class="setting-text"><strong>刷新数据</strong><small>获取最新持仓与行情，保留填写内容</small></span><svg class="icon chevron"><use href="#icon-arrow"/></svg></button><a id="native-connection" class="setting-row native-action" href="accufolio://connection" hidden><span class="setting-text"><strong>连接地址</strong><small>查看或更换投资账户的连接</small></span><svg class="icon chevron"><use href="#icon-arrow"/></svg></a><a id="native-update" class="setting-row native-action" href="accufolio://update" hidden><span class="setting-text"><strong>检查应用更新</strong><small>在应用内下载并安装新版本</small></span><svg class="icon chevron"><use href="#icon-arrow"/></svg></a><a id="native-reload" class="setting-row native-action" href="accufolio://reload" hidden><span class="setting-text"><strong>重新载入页面</strong><small>重新连接前会提示确认</small></span><svg class="icon chevron"><use href="#icon-arrow"/></svg></a><a id="native-settings" class="setting-row" href="accufolio://settings" hidden><span class="setting-text"><strong>连接与更新</strong><small>升级客户端后可直接在此管理</small></span><svg class="icon chevron"><use href="#icon-arrow"/></svg></a><div class="setting-row" id="browser-update-note"><span class="setting-text"><strong>保持最新</strong><small>新版本会自动检测，有未保存内容时先提醒你。</small></span></div></div></section>
    <section class="settings-group" id="server-data-settings"><h2>投资账户数据</h2><div class="settings-card"><a href="/api/export" class="setting-row"><span class="setting-text"><strong>导出投资记录</strong><small>保存一份 JSON 格式副本</small></span><svg class="icon chevron"><use href="#icon-arrow"/></svg></a><button type="button" id="backup" class="setting-row"><span class="setting-text"><strong>创建备份</strong><small>在连接的服务中保存完整数据库副本</small></span><svg class="icon chevron"><use href="#icon-arrow"/></svg></button></div></section>
    <section class="settings-group" id="system"><details><summary>运行状态与变更记录</summary><p id="health">正在检查</p><button type="button" id="load-audit">查看变更记录</button><div id="audit-items"></div></details></section><footer><img src="/icon-192.png" alt="" width="24" height="24"><span>Accufolio</span><small>长期投资，从容积累。</small></footer>
  </section>
