plugins { id 'com.android.application' }
android {
    namespace 'io.accufolio.app'
    compileSdk 35
    defaultConfig {
        applicationId 'io.accufolio.app'
        minSdk 29
        targetSdk 35
        versionCode 5
        versionName '1.4.0'
    }
    signingConfigs {
        release {
            if (System.getenv('ANDROID_KEYSTORE_PATH')) {
                storeFile file(System.getenv('ANDROID_KEYSTORE_PATH'))
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias 'accufolio'
                keyPassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release { signingConfig signingConfigs.release; minifyEnabled false }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    // Test HTTPS trust anchors are opted in only for the disposable CI debug build.
    if (project.hasProperty('androidIntegration')) {
        sourceSets.debug.manifest.srcFile 'src/integration/AndroidManifest.xml'
        sourceSets.debug.res.srcDirs += ['src/integration/res', "$buildDir/generated/integration/res"]
    }
    lint { abortOnError true; checkReleaseBuilds true }
}
dependencies { testImplementation 'junit:junit:4.13.2' }
