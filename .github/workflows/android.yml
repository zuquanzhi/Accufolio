name: Android
on:
  workflow_call:
    inputs:
      sign:
        type: boolean
        default: false
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Restore signing key
        if: inputs.sign
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE" || { echo 'Release signing secret is missing'; exit 1; }
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/accufolio.jks"
      - name: Unit tests, lint and signed release
        if: inputs.sign
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/accufolio.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: gradle -p apps/mobile testReleaseUnitTest lintRelease assembleRelease --no-daemon
      - name: Validate pull request build without signing secrets
        if: ${{ !inputs.sign }}
        run: gradle -p apps/mobile testDebugUnitTest lintDebug assembleDebug --no-daemon
      - name: Prepare APK and verify signature
        run: |
          mkdir -p dist
          if [ '${{ inputs.sign }}' = 'true' ]; then
            cp apps/mobile/app/build/outputs/apk/release/app-release.apk dist/Accufolio-1.4.0.apk
          else
            cp apps/mobile/app/build/outputs/apk/debug/app-debug.apk dist/Accufolio-1.4.0.apk
          fi
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs dist/Accufolio-1.4.0.apk
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare real HTTPS app integration
        run: |
          python -m pip install -r requirements.txt
          python scripts/android_integration.py prepare
          gradle -p apps/mobile assembleDebug -PandroidIntegration=true --no-daemon
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and smoke-test APK on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            python scripts/android_smoke.py dist/Accufolio-1.4.0.apk
            python scripts/android_integration.py run apps/mobile/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-results
          path: |
            work/android-integration-failure.png
            work/android-integration/failure-ui.xml
            work/android-recovery.png
            work/android-assets.png
            work/android-settings-page.png
            work/android-connection.png
            work/android-integration/server.log
            work/android-integration/navigation.log
            work/android-welcome.png
            work/android-onboarding.png
            apps/mobile/app/build/reports/
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/accufolio.jks"
