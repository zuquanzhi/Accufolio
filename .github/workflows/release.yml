name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Package and publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git archive --format=zip --prefix=Accufolio/ --output=Accufolio-${GITHUB_REF_NAME}.zip HEAD
          sha256sum Accufolio-${GITHUB_REF_NAME}.zip > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" "Accufolio-${GITHUB_REF_NAME}.zip" SHA256SUMS --title "Accufolio $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md --verify-tag
