name: Verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q packages apps
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt playwright==1.65.1
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/browser_smoke.py
      - run: python scripts/chart_smoke.py
      - run: python scripts/dashboard_smoke.py
      - run: python scripts/preferences_smoke.py
      - run: python scripts/income_smoke.py
      - run: python scripts/login_smoke.py
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t accufolio:test .
      - name: Verify container startup and persistent storage
        run: |
          docker run -d --name accufolio -e ACCUFOLIO_PASSWORD=ci-test-password -v accufolio_test:/data -p 127.0.0.1:8000:8000 accufolio:test
          for i in $(seq 1 30); do
            if curl --fail --silent -u admin:ci-test-password http://127.0.0.1:8000/api/health; then exit 0; fi
            sleep 1
          done
          docker logs accufolio
          exit 1

  android:
    uses: ./.github/workflows/android.yml
    with:
      sign: ${{ github.event_name == 'push' }}
    secrets: inherit
