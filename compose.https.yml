services:
  accufolio:
    environment:
      ACCUFOLIO_PUBLIC_ORIGIN: https://${ACCUFOLIO_DOMAIN:?Set your domain in .env}
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      ACCUFOLIO_DOMAIN: ${ACCUFOLIO_DOMAIN:?Set your domain in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  caddy_data:
  caddy_config:
