services:
  accufolio:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      ACCUFOLIO_USER: ${ACCUFOLIO_USER:-admin}
      ACCUFOLIO_PASSWORD: ${ACCUFOLIO_PASSWORD:?Set ACCUFOLIO_PASSWORD in .env}
      ACCUFOLIO_DB: /data/accufolio.db
      ACCUFOLIO_PUBLIC_ORIGIN: ${ACCUFOLIO_PUBLIC_ORIGIN:-}
      ACCUFOLIO_SCAN_INTERVAL: ${ACCUFOLIO_SCAN_INTERVAL:-300}
      ACCUFOLIO_LOGIN_MAX_ATTEMPTS: ${ACCUFOLIO_LOGIN_MAX_ATTEMPTS:-10}
      ACCUFOLIO_LOGIN_COOLDOWN: ${ACCUFOLIO_LOGIN_COOLDOWN:-300}
      ACCUFOLIO_BACKUP_KEEP: ${ACCUFOLIO_BACKUP_KEEP:-30}
      ACCUFOLIO_ALERT_RETENTION_DAYS: ${ACCUFOLIO_ALERT_RETENTION_DAYS:-365}
      ACCUFOLIO_ALERT_MAX_ROWS: ${ACCUFOLIO_ALERT_MAX_ROWS:-10000}
      ACCUFOLIO_WEBHOOK_URL: ${ACCUFOLIO_WEBHOOK_URL:-}
      ACCUFOLIO_WEBHOOK_TOKEN: ${ACCUFOLIO_WEBHOOK_TOKEN:-}
    volumes:
      - accufolio_data:/data
volumes:
  accufolio_data:
